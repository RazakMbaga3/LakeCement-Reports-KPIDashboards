# Lake Cement MIS — the Integration Package's Sales Dashboard at /sales-app/.
#
# Installed as /etc/nginx/snippets/lcl-sales-app.conf and included right AFTER
# the lcl-public-allowlist include, in every server block that serves the
# checkout (deploy/enable-sales-app-nginx.sh does it, with backup + rollback).
#
# WHAT IT FRONTS: the collaborator's Streamlit app (integration/sales-dashboard/
# app.py), run by pm2 as `sales-app` on 127.0.0.1:8501 with
# --server.baseUrlPath sales-app, so every one of its URLs — pages, assets,
# /sales-app/_stcore/stream (websocket), /sales-app/component/... — lives under
# this prefix. It is shown inside sales.html (same origin).
#
# WHY `^~`: the allowlist 404s every top-level directory except forms/,
# vendor/, api/ with a REGEX location. A prefix location marked ^~ that is the
# longest match makes nginx skip all regex locations, so /sales-app/ is served
# and the allowlist still covers everything else. The two `=` locations are
# exact matches, which also beat regexes.
#
# WHO GETS IN: nginx asks the API before every request (auth_request). The gate
# passes only a browser holding the HttpOnly cookie that sales.html
# obtains for a signed-in MD / Management / Sales user (routes/integration.js).
# Without it you are sent to the dashboard's tab, which needs our login first.
# Streamlit's own users.toml login then applies as a second layer.

location = /sales-app {
    return 301 /sales-app/;
}

location ^~ /sales-app/ {
    auth_request /__lcl_sales_app_gate;
    error_page 401 = @lcl_sales_app_signin;

    proxy_pass http://127.0.0.1:8501;        # no path: keep the /sales-app/ prefix
    proxy_http_version 1.1;
    # $http_host, not $host: Streamlit refuses the websocket (403) unless the
    # browser's Origin matches Host, and $host drops the port — measured
    # 2026-10-15 behind a non-443 port. On 443 the two are identical.
    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        "upgrade";
    proxy_read_timeout 86400s;               # the websocket stays open while the page is open
    proxy_send_timeout 86400s;
    proxy_buffering off;

    # Any add_header here drops ALL server-level headers (see the inheritance
    # note in nginx.digitalocean.conf), so the full set is restated. Only the
    # CSP differs from the rest of the site. Measured 2026-10-15 with
    # Playwright across all six Streamlit tabs (130 charts), removing one
    # relaxation at a time — each one below was shown to be needed:
    #   script-src 'wasm-unsafe-eval' — the only eval Streamlit does is
    #                                   WebAssembly; full 'unsafe-eval' is NOT granted
    #   font-src data:                — Streamlit inlines its icon fonts as data: URIs
    # Found unnecessary and therefore NOT granted: worker-src blob:, img-src
    # blob:. Custom components (st_autorefresh) are same-origin iframes, which
    # default-src 'self' already allows. No external origin is allowed:
    # Streamlit serves all of its own assets.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "no-referrer" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
}

# auth_request target. `internal` = unreachable from outside; no request body.
location = /__lcl_sales_app_gate {
    internal;
    proxy_pass http://127.0.0.1:5000/api/integration/sales-app-gate;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host $host;
    proxy_set_header X-Original-URI $request_uri;
}

# No (valid) cookie: go to the dashboard tab, which asks for our login and
# then issues the cookie.
location @lcl_sales_app_signin {
    return 302 /sales.html#sales-dashboard;
}
