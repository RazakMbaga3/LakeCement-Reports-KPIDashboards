# Lake Cement MIS — Nginx site config (plant LAN deployment)
#
# Serves the static frontend and reverse-proxies /api to the Node service.
# Windows: drop this in <nginx>/conf/servers/ (or include it from
# nginx.conf's http block), fix the two paths below, then: nginx -s reload
#
# Remember in backend/.env:
#   ALLOWED_ORIGIN=http://mis.lakecement.local   (this server's origin)
#   TRUST_PROXY=1                                (so req.ip is the real client)

server {
    listen 80;
    server_name mis.lakecement.local;   # or the server's LAN IP

    # ── Static frontend (repo root — the HTML/JS/CSS pages) ─────────
    root  "C:/apps/LakeCementDashboard";   # ← path to the checked-out repo
    index login.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # ── API → Node backend service ──────────────────────────────────
    location /api/ {
        proxy_pass http://127.0.0.1:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;           # monthly XLSX export can take a moment
    }

    client_max_body_size 12m;              # matches express.json limit (10mb) + headroom

    # Excel/JSON exports download with correct names
    add_header X-Content-Type-Options nosniff;
}
