# Lake Cement MIS — Nginx site config (DigitalOcean / Linux deployment)
#
# Serves the static frontend and reverse-proxies /api to the Node backend
# (managed by pm2, see docs/DEPLOYMENT_DIGITALOCEAN.md §2.6).
#
# Install:
#   sudo cp deploy/nginx-public-allowlist.conf /etc/nginx/snippets/lcl-public-allowlist.conf
#   sudo cp deploy/nginx.digitalocean.conf /etc/nginx/sites-available/lake-cement
#   sudo ln -s /etc/nginx/sites-available/lake-cement /etc/nginx/sites-enabled/
#   sudo nano /etc/nginx/sites-available/lake-cement   # confirm server_name below
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d smr.lakecement.co.tz --redirect   # adds HTTPS + redirect
#
# certbot needs the DNS A record smr.lakecement.co.tz -> 138.68.166.86 to exist
# first (it can't issue for a bare IP). If the name ever changes, swap
# server_name and rerun certbot — see docs/DEPLOYMENT_DIGITALOCEAN.md §2.7.
#
# Remember in backend/.env:
#   ALLOWED_ORIGIN=https://smr.lakecement.co.tz   (this server's real public origin)
#   APP_URL=https://smr.lakecement.co.tz          (links in invite/reset emails)
#   TRUST_PROXY=1                                 (so req.ip is the real client)

server {
    listen 80;
    server_name smr.lakecement.co.tz;

    # ── Static frontend (repo root — the HTML/JS/CSS pages) ─────────
    # Lives under the deploy user's home dir, not /var/www — nginx (running
    # as www-data) needs traverse permission on the home dir itself, or it
    # 403s even with the files inside readable: chmod o+x /home/deploy
    root /home/deploy/lake-cement-dashboard;
    # The root is the whole git checkout, so only the frontend may be served:
    # this 404s .env, .git/, backend/, docs/, workbooks… It must stay directly
    # after `root`, ahead of every other regex location. See the file itself.
    include snippets/lcl-public-allowlist.conf;
    # Integration Package: the collaborator's Streamlit Sales Dashboard,
    # proxied at /sales-app/ behind a login gate. Must come after the
    # allowlist (backend/test/nginx-allowlist.test.js checks that order).
    # Installed by deploy/enable-sales-app-nginx.sh; see the file itself.
    include snippets/lcl-sales-app.conf;
    index login.html;

    # ── Compression ─────────────────────────────────────────────────
    # This site is text: the largest page is 257KB of HTML, and auth.js
    # and design-system.css are 60KB and 58KB. Over the plant's own
    # connection that is the difference between a 6-second load and a
    # 2-second one, and it costs nothing but CPU. Measured with
    # e2e/perf-audit.js.
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/javascript
                      application/javascript application/json
                      application/xml image/svg+xml;

    # ── Security headers (STATIC PAGES) ─────────────────────────────
    # helmet() in backend/server.js covers /api/* only, because nginx
    # serves the HTML/JS/CSS directly and those responses never pass
    # through Express. Measured 2026-09-30: /api/health carried CSP, HSTS,
    # X-Frame-Options and Referrer-Policy while /login.html carried nothing
    # but nosniff — i.e. the one page where credentials are typed was the
    # least protected page on the site.
    #
    # `always` matters: without it nginx drops these on 4xx/5xx responses,
    # so an error page would lose them.
    #
    # HSTS is safe here because certbot already redirects 80 -> 443 for
    # this server_name (verified: http returns 301 to https). preload is
    # deliberately NOT set — it is effectively irreversible and should be a
    # conscious decision, not a side effect of this block.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "no-referrer" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # Content-Security-Policy — written against what these pages ACTUALLY
    # do, not against an ideal. Two deliberate relaxations, both verified
    # necessary rather than assumed:
    #
    #   'unsafe-inline' in script-src  — the pages carry inline <script>
    #       blocks (index.html 4, daily-report.html 10, login.html 1) AND
    #       inline handlers (mis.html 35 onclick=, index.html 19). Removing
    #       these is a real refactor across 27 pages; shipping a policy that
    #       breaks the app is worse than shipping an honest one that does
    #       not. Note this is why script-src-attr is not set to 'none' as
    #       helmet's default does for /api.
    #   'unsafe-eval'                  — NOT granted. Add only if a chart
    #       library is shown to need it.
    #
    # External origins are the two CDNs the pages really load (chart.js via
    # jsdelivr, lucide via cdnjs) plus Google Fonts. Nothing else is
    # allowed, so an injected <script src> to an attacker's host is blocked
    # even though inline script is permitted.
    #
    # connect-src is 'self': the frontend talks only to /api on this same
    # origin through nginx.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

    location / {
        try_files $uri $uri/ =404;
    }

    # ── Caching ─────────────────────────────────────────────────────
    # HTML always revalidates, so a deploy is live immediately. Shared
    # JS/CSS are cached for a day only: they carry ?v= query strings, but
    # those are bumped by hand, so a long max-age would serve stale code
    # to anyone who forgot. Images and fonts change once a year.
    #
    # IF YOU EDIT A SHARED ASSET, BUMP ITS ?v= IN EVERY PAGE THAT LOADS
    # IT — otherwise returning users keep yesterday's copy for a day.
    # ⚠️ nginx add_header INHERITANCE TRAP — read before editing.
    # add_header is NOT additive across levels: as soon as a location block
    # declares ANY add_header, every add_header from the server level is
    # discarded for that location. So the security block above reached
    # nothing that matched these two locations — which is every HTML page
    # and every script on the site — because each already set
    # Cache-Control. The headers below are therefore repeated verbatim, not
    # redundantly. If you add an add_header to a new location block, repeat
    # this set there too, or that location silently loses all of it.
    #
    # Verify after any change to this file:
    #   curl -sI https://smr.lakecement.co.tz/login.html | grep -iE 'strict|frame|content-security|referrer'
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options           "SAMEORIGIN" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header Referrer-Policy           "no-referrer" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
    }
    location ~* \.(?:js|css)$ {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header Referrer-Policy           "no-referrer" always;
    }
    location ~* \.(?:png|jpe?g|gif|svg|ico|webp|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        # Same inheritance trap as above. An SVG is a scriptable document,
        # so nosniff and a frame guard are not pointless on this location.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header X-Frame-Options           "SAMEORIGIN" always;
        access_log off;
    }

    # ── API → Node backend (pm2, port 5000) ──────────────────────────
    location /api/ {
        proxy_pass http://127.0.0.1:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;           # monthly XLSX export can take a moment
    }

    client_max_body_size 12m;              # matches express.json limit (10mb) + headroom

    # Excel/JSON exports download with correct names
    add_header X-Content-Type-Options nosniff;
}
