# Lake Cement MIS — Nginx site config (DigitalOcean / Linux deployment)
#
# Serves the static frontend and reverse-proxies /api to the Node backend
# (managed by pm2, see docs/DEPLOYMENT_DIGITALOCEAN.md §2.6).
#
# Install:
#   sudo cp deploy/nginx.digitalocean.conf /etc/nginx/sites-available/lake-cement
#   sudo ln -s /etc/nginx/sites-available/lake-cement /etc/nginx/sites-enabled/
#   sudo nano /etc/nginx/sites-available/lake-cement   # set server_name below
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d <your-domain>               # adds HTTPS + redirect
#
# Remember in backend/.env:
#   ALLOWED_ORIGIN=https://<your-domain>   (this server's real public origin)
#   TRUST_PROXY=1                          (so req.ip is the real client)

server {
    listen 80;
    server_name mis.lakecement.co.tz;   # ← replace with the real domain/IP

    # ── Static frontend (repo root — the HTML/JS/CSS pages) ─────────
    root /var/www/lake-cement-dashboard;
    index login.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # ── API → Node backend (pm2, port 5000) ──────────────────────────
    location /api/ {
        proxy_pass http://127.0.0.1:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;           # monthly XLSX export can take a moment
    }

    client_max_body_size 12m;              # matches express.json limit (10mb) + headroom

    # Excel/JSON exports download with correct names
    add_header X-Content-Type-Options nosniff;
}
