# Lake Cement MIS — what nginx may serve from the web root (an allowlist).
#
# Installed as /etc/nginx/snippets/lcl-public-allowlist.conf and included
# straight after the `root` line of every server block that serves the
# checkout (deploy/harden-webroot.sh does both, with rollback).
#
# WHY: the web root IS the git checkout (/home/deploy/lake-cement-dashboard),
# so without these rules nginx happily served backend/.env (JWT secret, DB
# and SMTP passwords, Odoo keys), the whole .git directory, the HR roster in
# backend/data/mis/employees.json and every business workbook at the repo
# root. Measured on production 2026-10-12: all of those returned 200.
#
# The public surface is exactly: root-level pages and assets, forms/,
# vendor/, and /api/ (proxied to Node). Everything else 404s — a 404, not a
# 403, so a probe cannot tell "exists but forbidden" from "not there".
#
# ORDER MATTERS. nginx tries regex locations in the order they appear and the
# first match wins, so these must come BEFORE the caching regexes
# (\.html$, \.(js|css)$, images) — otherwise /backend/routes/auth.js would
# match the .js caching rule first and be served. Including this file right
# after `root` guarantees that. /api/ is excluded explicitly because a
# matching regex beats a plain prefix location like `location /api/`.
#
# backend/test/nginx-allowlist.test.js exercises both patterns against a
# table of must-serve / must-refuse paths. Change them together.

# 1. Any path inside a directory other than the frontend's own (forms/,
#    vendor/), the API, or certbot's challenge directory. Covers /.git/,
#    /backend/ (and its .env), /data/, /docs/, /deploy/, /e2e/, /scripts/,
#    /node_modules/, the report-archive folders, and any backup or log
#    directory someone creates inside the checkout later.
location ~ ^/(?!(?:forms|vendor|api|\.well-known)/)[^/]*/ {
    return 404;
}

# 2. Any file — at the root or inside forms/ and vendor/ — that is not a web
#    asset: dotfiles (.env, .gitignore), workbooks, PDFs, markdown, scripts.
location ~* ^/(?!api/|\.well-known/)(?!.*\.(?:html|js|css|png|jpe?g|gif|svg|ico|webp|woff2?)$).*[^/]$ {
    return 404;
}
