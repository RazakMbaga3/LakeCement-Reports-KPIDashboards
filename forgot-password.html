<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Lake Cement – Forgot Password</title>
  <link rel="icon" type="image/png" href="favicon.png" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root { --navy:#173158; --orange:#F49545; --border:#E2E8F0; --muted:#64748B; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
           padding:24px; background:#F4F6F9; font-family:Inter,system-ui,sans-serif; color:var(--navy); }
    .card { width:100%; max-width:420px; background:#fff; border-radius:14px; overflow:hidden;
            box-shadow:0 1px 3px rgba(0,0,0,.08), 0 8px 24px rgba(0,0,0,.07); }
    .card-head { padding:30px 32px 20px; text-align:center; border-bottom:1px solid var(--border); }
    .card-head img { height:40px; object-fit:contain; margin-bottom:14px; }
    .card-title { font-size:15px; font-weight:800; letter-spacing:-.2px; }
    .card-sub { margin-top:3px; font-size:12px; color:var(--text-muted); font-weight:500; }
    .accent { height:3px; background:var(--orange); }
    .card-body { padding:24px 32px 28px; }
    label { display:block; font-size:12px; font-weight:700; text-transform:uppercase;
            letter-spacing:.5px; color:var(--muted); margin-bottom:6px; }
    input { width:100%; font-family:inherit; font-size:14px; padding:12px 12px;
            border:1.5px solid var(--border); border-radius:6px; color:var(--navy); }
    input:focus { outline:none; border-color:var(--navy); }
    .btn { width:100%; margin-top:16px; font-family:inherit; font-size:14px; font-weight:700;
           padding:12px; border:none; border-radius:6px; background:var(--orange); color:var(--on-orange); cursor:pointer; }
    .btn:hover { background:#E08430; }
    .btn:disabled { background:#CBD5E1; cursor:not-allowed; }
    .msg { font-size:12.5px; line-height:1.55; padding:12px 12px; border-radius:6px; margin-bottom:16px; }
    .msg-ok  { background:var(--st-good-bg); border:1.5px solid #6EE7B7; color:#047857; }
    .msg-err { background:var(--st-bad-bg); border:1.5px solid var(--st-bad-bd); color:#B91C1C; }
    .lead { font-size:12.5px; color:var(--muted); line-height:1.55; margin:0 0 16px; }
    .foot { text-align:center; margin-top:16px; font-size:12px; }
    .foot a { color:var(--navy); font-weight:600; text-decoration:none; }
    .foot a:hover { text-decoration:underline; }
  </style>
  <!-- Design system — loaded last so it settles equal-specificity ties -->
  <link rel="stylesheet" href="design-system.css?v=1" />
  <script src="a11y.js?v=1"></script>
  <script src="mobile-shell.js?v=3"></script>
</head>
<body>

<div class="card">
  <div class="card-head">
    <img src="NYATI-LOGO.png" alt="Nyati Cement" />
    <div class="card-title">Lake Cement MIS</div>
    <div class="card-sub">Forgot your password</div>
  </div>
  <div class="accent"></div>
  <div class="card-body" id="body">
    <p class="lead">Enter your company email address. If it belongs to an MIS account, we will send you a link to choose a new password.</p>
    <div id="err" class="msg msg-err" style="display:none"></div>
    <form id="f" autocomplete="on">
      <label for="email">Company email</label>
      <input type="email" id="email" name="email" placeholder="firstname.lastname@lakecement.co.tz"
             autocomplete="email" required />
      <button type="submit" class="btn" id="go">Send me a link</button>
    </form>
    <div class="foot"><a href="login.html">Back to sign in</a></div>
  </div>
</div>

<script>
(function () {
  'use strict';
  const API = (location.hostname === 'localhost' || location.hostname === '127.0.0.1')
    ? 'http://localhost:5000/api' : '/api';
  const $ = id => document.getElementById(id);

  $('f').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = $('go'); btn.disabled = true; btn.textContent = 'Sending…';
    $('err').style.display = 'none';
    try {
      const res = await fetch(API + '/auth/forgot-password', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: $('email').value.trim() }),
      });
      const body = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(body.error || 'Could not send the link. Try again shortly.');

      /* The server answers identically whether or not the address is on an
         account, so this page must too — showing "no such user" here would
         undo that and turn the form into an address checker. */
      $('body').innerHTML = `<div class="msg msg-ok">${body.message}</div>
        <p class="lead">If nothing arrives within a few minutes, check your junk mail, then contact the IT department.</p>
        <div class="foot"><a href="login.html">Back to sign in</a></div>`;
    } catch (err) {
      $('err').textContent = err.message;
      $('err').style.display = '';
      btn.disabled = false; btn.textContent = 'Send me a link';
    }
  });
})();
</script>
</body>
</html>
