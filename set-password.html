<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Lake Cement – Choose Your Password</title>
  <link rel="icon" type="image/png" href="favicon.png" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root { --navy:#173158; --orange:#F49545; --green:#239557; --border:#E2E8F0; --muted:#64748B; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 24px; background: #F4F6F9; font-family: Inter, system-ui, sans-serif; color: var(--navy);
    }
    .card { width: 100%; max-width: 420px; background: #fff; border-radius: 12px; overflow: hidden;
            box-shadow: 0 1px 3px rgba(0,0,0,.08), 0 8px 24px rgba(0,0,0,.07); }
    .card-head { padding: 30px 32px 22px; text-align: center; border-bottom: 1px solid var(--border); }
    .card-head img { height: 40px; object-fit: contain; margin-bottom: 14px; }
    .card-title { font-size: 15px; font-weight: 800; letter-spacing: -.2px; }
    .card-sub { margin-top: 3px; font-size: 12px; color: #94A3B8; font-weight: 500; }
    .accent { height: 3px; background: var(--orange); }
    .card-body { padding: 24px 32px 28px; }

    label { display: block; font-size: 12px; font-weight: 700; text-transform: uppercase;
            letter-spacing: .5px; color: var(--muted); margin-bottom: 6px; }
    input[type=password], input[type=text] {
      width: 100%; font-family: inherit; font-size: 14px; padding: 11px 12px;
      border: 1.5px solid var(--border); border-radius: 8px; color: var(--navy); background: #fff;
    }
    input:focus { outline: none; border-color: var(--navy); }
    .field + .field { margin-top: 16px; }

    .btn { width: 100%; margin-top: 20px; font-family: inherit; font-size: 14px; font-weight: 700;
           padding: 12px; border: none; border-radius: 8px; background: var(--orange); color: #fff; cursor: pointer; }
    .btn:hover { background: #E08430; }
    .btn:disabled { background: #CBD5E1; cursor: not-allowed; }

    .msg { font-size: 12.5px; line-height: 1.55; padding: 11px 13px; border-radius: 8px; margin-bottom: 16px; }
    .msg-err { background: #FEF2F2; border: 1.5px solid #FCA5A5; color: #B91C1C; }
    .msg-ok  { background: #ECFDF5; border: 1.5px solid #6EE7B7; color: #047857; }
    .msg-info{ background: #F8FAFC; border: 1.5px solid var(--border); color: var(--muted); }

    /* Live password-rule feedback: the rules are the server's, restated so a
       rejected password is not the first time the user learns them. */
    .rules { list-style: none; padding: 0; margin: 12px 0 0; font-size: 12px; color: var(--muted); }
    .rules li { padding: 2.5px 0 2.5px 20px; position: relative; }
    .rules li::before { content: '○'; position: absolute; left: 4px; color: #CBD5E1; }
    .rules li.ok { color: var(--green); }
    .rules li.ok::before { content: '●'; color: var(--green); }

    .foot { text-align: center; margin-top: 18px; font-size: 12px; }
    .foot a { color: var(--navy); font-weight: 600; text-decoration: none; }
    .foot a:hover { text-decoration: underline; }
    .who { font-size: 12.5px; color: var(--muted); margin-bottom: 16px; line-height: 1.5; }
    .who strong { color: var(--navy); }
  </style>
  <!-- Design system — loaded last so it settles equal-specificity ties -->
  <link rel="stylesheet" href="design-system.css?v=1" />
  <script src="mobile-shell.js?v=1"></script>
</head>
<body>

<div class="card">
  <div class="card-head">
    <img src="NYATI-LOGO.png" alt="Nyati Cement" />
    <div class="card-title">Lake Cement MIS</div>
    <div class="card-sub" id="head-sub">Checking your link…</div>
  </div>
  <div class="accent"></div>
  <div class="card-body" id="body">
    <div class="msg msg-info">One moment…</div>
  </div>
</div>

<script>
(function () {
  'use strict';

  const API = (location.hostname === 'localhost' || location.hostname === '127.0.0.1')
    ? 'http://localhost:5000/api' : '/api';

  const qs      = new URLSearchParams(location.search);
  const token   = qs.get('t') || '';
  const purpose = qs.get('p') === 'reset' ? 'reset' : 'invite';

  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  function dead(message) {
    $('head-sub').textContent = 'Link problem';
    $('body').innerHTML = `<div class="msg msg-err">${esc(message)}</div>
      <div class="foot"><a href="login.html">Back to sign in</a></div>`;
  }

  function form(user) {
    $('head-sub').textContent = purpose === 'invite' ? 'Activate your account' : 'Reset your password';
    $('body').innerHTML = `
      <p class="who">${purpose === 'invite'
        ? `Welcome, <strong>${esc(user.full_name)}</strong>. Choose a password to activate your account. Your sign-in name is <strong>${esc(user.username)}</strong>.`
        : `Choose a new password for <strong>${esc(user.username)}</strong>.`}</p>
      <div id="err" class="msg msg-err" style="display:none"></div>
      <form id="f" autocomplete="off">
        <div class="field">
          <label for="pw1">New password</label>
          <input type="password" id="pw1" autocomplete="new-password" required />
          <ul class="rules">
            <li id="r-len">At least 10 characters</li>
            <li id="r-ltr">Contains a letter</li>
            <li id="r-dig">Contains a number</li>
          </ul>
        </div>
        <div class="field">
          <label for="pw2">Confirm password</label>
          <input type="password" id="pw2" autocomplete="new-password" required />
        </div>
        <button type="submit" class="btn" id="go" disabled>
          ${purpose === 'invite' ? 'Activate my account' : 'Change my password'}
        </button>
      </form>
      <div class="foot" style="margin-top:14px;color:var(--muted);font-size:12px">
        Nobody else, including IT, will know this password.
      </div>`;

    const rules = () => {
      const v = $('pw1').value;
      const ok = { len: v.length >= 10, ltr: /[A-Za-z]/.test(v), dig: /[0-9]/.test(v) };
      $('r-len').classList.toggle('ok', ok.len);
      $('r-ltr').classList.toggle('ok', ok.ltr);
      $('r-dig').classList.toggle('ok', ok.dig);
      // Enable only when the rules pass AND the confirmation matches — the
      // most common failure here is a typo in a field you cannot read back.
      $('go').disabled = !(ok.len && ok.ltr && ok.dig && v && v === $('pw2').value);
    };
    $('pw1').addEventListener('input', rules);
    $('pw2').addEventListener('input', rules);

    $('f').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = $('go'); btn.disabled = true;
      $('err').style.display = 'none';
      try {
        const res = await fetch(API + '/auth/set-password', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, purpose, newPassword: $('pw1').value }),
        });
        const body = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(body.error || 'Could not set your password.');

        $('head-sub').textContent = 'Done';
        $('body').innerHTML = `<div class="msg msg-ok">${esc(body.message)}</div>
          <div class="foot"><a href="login.html">Go to sign in</a></div>`;
      } catch (err) {
        $('err').textContent = err.message;
        $('err').style.display = '';
        btn.disabled = false;
      }
    });
  }

  /* Check the link before showing the form, so a dead link says why instead
     of letting someone type a password that will be thrown away. */
  (async function init() {
    if (!token) return dead('This link is incomplete. Open the full link from your email, or ask IT for a new one.');
    try {
      const res = await fetch(`${API}/auth/token/${purpose}/${encodeURIComponent(token)}`);
      const body = await res.json().catch(() => ({}));
      if (!res.ok) return dead(body.error || 'This link is not valid.');
      form(body);
    } catch {
      dead('Could not reach the server. Check your connection and try the link again.');
    }
  })();
})();
</script>
</body>
</html>
