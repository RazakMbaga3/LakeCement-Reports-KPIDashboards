  <style>
    /* â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
       PORTAL HOME — page styles
    â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â• */
    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      background: var(--off-white, #F8FAFC);
    }

    /* ── Greeting bar ────────────────────────────────── */
    .portal-greeting {
      background: white;
      border-bottom: 1px solid var(--border, #E2E8F0);
      padding: 18px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }
    .pg-title {
      font-size: 19px;
      font-weight: 800;
      color: var(--navy, #173158);
      margin: 0 0 3px;
      letter-spacing: -.2px;
    }
    .pg-sub {
      font-size: 12px;
      color: var(--text-muted, #64748B);
      font-weight: 500;
      margin: 0;
    }
    .pg-date {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted, #64748B);
      white-space: nowrap;
      padding: 5px 13px;
      background: var(--off-white, #F8FAFC);
      border: 1px solid var(--border, #E2E8F0);
      border-radius: 20px;
    }

    /* ── Main content ────────────────────────────────── */
    .portal-main {
      flex: 1;
      padding: 28px 28px 56px;
      max-width: 1400px;
      width: 100%;
      margin: 0 auto;
    }

    /* ── Section ─────────────────────────────────────── */
    .portal-section { margin-bottom: 34px; }
    .portal-section-hdr {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 13px;
    }
    .psh-dot {
      width: 8px; height: 8px;
      border-radius: 2px;
      flex-shrink: 0;
    }
    .psh-label {
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1.1px;
      color: var(--text-muted, #64748B);
    }
    .psh-count {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted, #64748B);
      background: var(--off-white, #F8FAFC);
      border: 1px solid var(--border, #E2E8F0);
      border-radius: 10px;
      padding: 1px 7px;
    }

    /* ── Card grid ───────────────────────────────────── */
    .portal-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 18px;
    }

    /* ── Card ─────────────────────────────────────────── */
    .pcard {
      position: relative;
      display: flex;
      flex-direction: column;
      background: white;
      border: 1.5px solid var(--border, #E2E8F0);
      border-radius: 12px;
      overflow: hidden;
      text-decoration: none;
      transition: box-shadow .17s, border-color .17s, transform .13s;
      box-shadow: 0 1px 3px rgba(0,0,0,.05);
    }
    .pcard:hover {
      box-shadow: 0 6px 24px rgba(23,49,88,.13);
      border-color: rgba(23,49,88,.22);
      transform: translateY(-2px);
    }
    .pcard-accent {
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 4px;
    }
    .pcard-icon {
      padding: 16px 16px 8px 24px;
    }
    .pcard-body {
      padding: 4px 16px 4px 24px;
      flex: 1;
    }
    .pcard-title {
      font-size: 13px;
      font-weight: 800;
      color: var(--navy, #173158);
      margin-bottom: 6px;
      line-height: 1.35;
    }
    .pcard-sub {
      font-size: 12px;
      color: var(--text-muted, #64748B);
      line-height: 1.6;
      font-weight: 500;
    }
    .pcard-footer {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      padding: 8px 16px 16px 24px;
      margin-top: 8px;
    }
    .pcard-badge {
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .7px;
      padding: 4px 8px;
      border-radius: var(--r-sm, 6px);
    }
    /* VIEW is where most cards land, so it is the quiet one: a badge on
       every card carries no information. SUBMIT keeps the warm tone
       because it is the only one asking the reader to do something. */
    .badge-view   { background:var(--st-neutral-bg,#F1F3F7); color:var(--st-neutral,#5A6270); border:1px solid var(--st-neutral-bd,#DDE3EC); }
    .badge-submit { background:var(--st-warn-bg,#FDF3E2);    color:var(--amber-ink,#B45309); border:1px solid var(--st-warn-bd,#F0CE92); }

    /* ── Empty state ─────────────────────────────────── */
    .portal-empty {
      padding: 64px 24px;
      text-align: center;
      color: var(--text-muted, #64748B);
      font-size: 13px;
      font-weight: 500;
    }

    /* ── Footer ─────────────────────────────────────── */
    .portal-footer {
      text-align: center;
      padding: 14px 24px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      letter-spacing: .4px;
      border-top: 1px solid var(--border, #E2E8F0);
      background: white;
    }

    /* ── Responsive ─────────────────────────────────── */
    /* ── Desktop: fit viewport when content is short, scroll when it isn't ── */
    @media (min-width: 769px) {
      html { height: 100%; }
      body { min-height: 100vh; height: auto; }
      .portal-greeting { padding: 10px 28px; }
      .portal-footer   { padding: 7px 24px;  }
      .portal-main {
        flex: 1; min-height: 0; overflow-y: auto; padding: 14px 28px 0;
      }
      .portal-section     { margin-bottom: 16px; }
      .portal-section-hdr { margin-bottom: 8px;  }
      .portal-grid { gap: 12px; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); }
      /* stretch, not center: centring each card's contents against its
         own height meant a one-line title and a two-line title started
         at different heights in the same row, so a grid of cards read
         as ragged even though the cards themselves were equal. */
      .pcard { flex-direction: row; align-items: stretch; min-height: 84px; gap: 18px; padding: 18px 22px; }
      .pcard-icon   { padding: 0; flex-shrink: 0; }
      .pcard-body   { padding: 0; flex: 1; }
      /* Two lines reserved so the descriptions below them start on one
         line across the row too. */
      .pcard-title  { font-size: 13.5px; margin-bottom: 5px; min-height: 37px; }
      .pcard-sub    { font-size: 12px; line-height: 1.5; }
      .pcard-footer { padding: 0; margin-top: 0; flex-shrink: 0; gap: 10px; align-items: center; }
    }
    /* ── Mobile ────────────────────────────────────────────────── */
    @media (max-width: 768px) {
      .portal-main     { padding: 16px 14px 40px; }
      .portal-greeting { padding: 14px 16px; }
      .pg-title        { font-size: 16px; }
      .portal-grid     { grid-template-columns: 1fr 1fr; gap: 10px; }
    }
    @media (max-width: 400px) {
      .portal-grid { grid-template-columns: 1fr; }
    }
  </style>
