<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Plant Memory Search — Lake Cement MIS</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="stylesheet" href="styles.css" />
<script src="auth.js?v=12"></script>
<script src="forms/api-client.js"></script>
<script src="sidebar.js?v=4"></script>
<script src="loader.js?v=2"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Inter',system-ui,sans-serif; color:#173158; }
  .wrap { max-width:900px; margin:24px auto; padding:0 16px; }
  .searchbar { display:flex; gap:10px; margin-bottom:8px; }
  .searchbar input { flex:1; border:1.5px solid #DDE3EC; border-radius:9px; padding:12px 16px;
    font:600 14px 'Inter',sans-serif; color:#173158; }
  .searchbar button { border:none; border-radius:9px; padding:12px 20px; font:700 13px 'Inter',sans-serif;
    cursor:pointer; background:#F49545; color:var(--on-orange); }
  .hint { font-size:12px; color:var(--text-muted); margin-bottom:16px; }
  .card { background:white; border:1.5px solid #DDE3EC; border-radius:14px; overflow:hidden; margin-bottom:16px; }
  .card h2 { font-size:12px; text-transform:uppercase; letter-spacing:.7px; background:#173158; color:white; padding:8px 16px; }
  table { width:100%; border-collapse:collapse; font-size:12px; }
  td { padding:8px 14px; border-bottom:1px solid #F0F4F8; vertical-align:top; }
  .k { font-weight:700; white-space:nowrap; }
  .d { color:#64748B; }
  .snippet { font-family:Consolas,monospace; font-size:12px; color:#173158; background:#F7F8FA;
    border-radius:6px; padding:2px 6px; display:inline-block; margin:1px 0; }
  mark { background:var(--st-warn-bd); border-radius:2px; padding:0 1px; }
  .empty { padding:20px; text-align:center; color:var(--text-muted); font-size:12px; }
</style>
  <!-- Design system — loaded last so it settles equal-specificity ties -->
  <link rel="stylesheet" href="design-system.css?v=1" />
  <script src="lucide-icons.js?v=1"></script>
  <script src="a11y.js?v=1"></script>
  <script src="mobile-shell.js?v=1"></script>
</head>
<body>

<div class="app-shell">
  <aside class="sidebar" id="app-sidebar"></aside>
  <script>renderSidebar();</script>

  <div class="main">
    <header class="top-header" id="app-header"></header>
    <script>renderTopHeader();</script>

<div class="wrap">
  <div class="searchbar">
    <input id="q" placeholder='e.g. "cooler tripped"'
           onkeydown="if(event.key==='Enter')doSearch()">
    <button onclick="doSearch()">Search</button>
  </div>
  <div class="hint">
    Searches every daily report entry, every KPI override reason, and the audit trail —
    "what did we do last time this happened?" now has an answer.
  </div>

  <div class="card"><h2>Daily report entries</h2><div id="r-forms"><div class="empty">Type a search above.</div></div></div>
  <div class="card"><h2>KPI override reasons</h2><div id="r-overrides"><div class="empty">Type a search above.</div></div></div>
  <div class="card"><h2>Audit trail</h2><div id="r-audit"><div class="empty">Type a search above.</div></div></div>
</div>

  </div>
</div><!-- /.app-shell -->

<script src="forms/client-errors.js"></script>
<script>
  requireAuth();
  const API = (typeof _API_BASE !== 'undefined') ? _API_BASE : 'http://localhost:5000/api';
  // esc() delegates to the shared escHtml() (forms/api-client.js) — this
  // page's own version previously missed escaping "'", unlike the others.
  const esc = s => escHtml(s);
  const when = t => t ? new Date(t).toLocaleString('en-GB', { day:'2-digit', month:'short', year:'numeric' }) : '—';

  let _lastQ = '';
  function hi(text) {
    // highlight the query inside an ALREADY-ESCAPED string
    if (!_lastQ) return text;
    const pat = _lastQ.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    return text.replace(new RegExp(pat, 'gi'), m => '<mark>' + m + '</mark>');
  }

  function fill(el, rowsHtml, emptyMsg) {
    document.getElementById(el).innerHTML = rowsHtml
      ? '<table>' + rowsHtml + '</table>'
      : '<div class="empty">' + emptyMsg + '</div>';
  }

  async function doSearch() {
    const q = document.getElementById('q').value.trim();
    if (q.length < 3) return;
    _lastQ = q;

    let r;
    try {
      const res = await fetch(API + '/insights/search?q=' + encodeURIComponent(q), {
        headers: { 'Authorization': 'Bearer ' + getAuthToken() },
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      r = await res.json();
    } catch (e) {
      fill('r-forms', '', 'Search failed — is the backend running? (' + e.message + ')');
      return;
    }

    fill('r-forms', r.forms.map(f =>
      '<tr><td class="k">' + esc(f.formType) + '</td><td class="d">' + esc(f.date) + '</td><td>' +
      f.snippets.map(s => '<span class="snippet">' + hi(esc(s)) + '</span>').join('<br>') +
      '</td></tr>').join(''), 'No matching report entries.');

    fill('r-overrides', r.overrides.map(o =>
      '<tr><td class="k">' + esc(o.kpi_key) + '</td><td class="d">' + o.year + '-' +
      String(o.month).padStart(2, '0') + '</td><td>' + hi(esc(o.reason)) +
      '<br><span class="d">' + esc(o.created_by_name || '') + ' · ' + when(o.created_at) +
      (o.cleared_at ? ' · cleared' : ' · active') + '</span></td></tr>').join(''), 'No matching override reasons.');

    fill('r-audit', r.audit.map(a =>
      '<tr><td class="k">' + esc(a.action) + '</td><td class="d">' + when(a.created_at) + '</td><td>' +
      hi(esc(a.details || '')) + '<br><span class="d">' + esc(a.username || '') + '</span></td></tr>').join(''),
      'No matching audit entries.');
  }
</script>
</body>
</html>
