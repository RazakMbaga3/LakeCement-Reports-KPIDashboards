<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lake Cement – Entry Completeness</title>
  <link rel="icon" type="image/png" href="favicon.png" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <script src="auth.js?v=9"></script>
  <script src="forms/date-picker.js"></script>
  <style>
    .cp-bar {
      background: white;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: var(--header-h, 68px);
      z-index: 80;
      box-shadow: var(--shadow-sm);
    }
    .cp-bar-inner { display: flex; align-items: center; gap: 14px; padding: 10px 28px; flex-wrap: wrap; }
    .cp-lbl { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .8px; color: var(--text-muted); }
    .cp-input {
      padding: 5px 10px; border-radius: 6px; border: 1px solid var(--border);
      background: var(--off-white); font-family: var(--font); font-size: 11px; font-weight: 600;
      color: var(--navy); cursor: pointer;
    }
    .cp-pills { display: flex; gap: 4px; background: var(--off-white); border: 1px solid var(--border); border-radius: 8px; padding: 3px; }
    .cp-pill { padding: 5px 14px; border-radius: 5px; border: none; background: transparent; font-family: var(--font); font-size: 11px; font-weight: 600; color: var(--text-muted); cursor: pointer; }
    .cp-pill:hover  { color: var(--navy); background: rgba(23,49,88,.06); }
    .cp-pill.active { background: var(--navy); color: white; }

    .cp-main { max-width: 1400px; margin: 0 auto; padding: 20px 28px 60px; }
    .cp-legend { display: flex; align-items: center; gap: 16px; font-size: 11px; color: var(--text-muted); margin-bottom: 14px; }
    .cp-legend-item { display: flex; align-items: center; gap: 6px; }
    .cp-legend-dot { width: 11px; height: 11px; border-radius: 3px; display: inline-block; }

    .cp-table-wrap { overflow-x: auto; background: white; border: 1.5px solid var(--border); border-radius: 12px; }
    table.cp-table { border-collapse: collapse; font-size: 11px; white-space: nowrap; }
    table.cp-table th, table.cp-table td { padding: 0; }
    .cp-row-label {
      position: sticky; left: 0; background: white; z-index: 2;
      padding: 8px 16px !important; text-align: left; font-weight: 700; color: var(--navy);
      border-right: 1.5px solid var(--border); width: 170px; min-width: 170px; max-width: 170px;
      white-space: normal;
    }
    .cp-col-hdr {
      padding: 6px 3px !important; text-align: center; font-size: 9px; font-weight: 700;
      color: var(--text-muted); writing-mode: vertical-rl; text-orientation: mixed; height: 46px;
    }
    .cp-col-hdr.wk-start { border-left: 1.5px solid var(--border); }
    table.cp-table { table-layout: fixed; }
    .cp-cell {
      width: 22px; min-width: 22px; max-width: 22px; height: 24px;
      padding: 3px !important; border-bottom: 1px solid #F0F4F8;
    }
    .cp-cell.wk-start { border-left: 1.5px solid var(--border); }
    .cp-dot { display: block; width: 100%; height: 100%; border-radius: 3px; cursor: default; }
    .cp-dot.present { background: #239557; }
    .cp-dot.missing { background: #FCA5A5; }
    .cp-dot.future  { background: #F1F5FB; }
    .cp-pct { padding: 8px 12px !important; text-align: right; font-weight: 700; }
    .cp-pct.good { color: #239557; } .cp-pct.fair { color: #D97706; } .cp-pct.poor { color: #DC2626; }

    .cp-empty { text-align: center; padding: 60px 20px; color: var(--text-muted); }
  </style>
</head>
<body>

<header class="top-header" id="app-header"></header>
<script>renderTopHeader();</script>

<div class="cp-bar">
  <div class="cp-bar-inner">
    <span class="cp-lbl">Range</span>
    <div class="cp-pills">
      <button class="cp-pill" data-months="1">This month</button>
      <button class="cp-pill active" data-months="3">Last 3 months</button>
      <button class="cp-pill" data-months="6">Last 6 months</button>
    </div>
    <span class="cp-lbl">or</span>
    <input type="date" id="cp-from" class="cp-input" />
    <span class="cp-lbl">to</span>
    <input type="date" id="cp-to" class="cp-input" />
    <button class="cp-pill" id="cp-apply" style="background:var(--orange);color:white">Apply</button>
  </div>
</div>

<main class="cp-main">
  <div class="cp-legend">
    <span class="cp-legend-item"><span class="cp-legend-dot" style="background:#239557"></span> Entered</span>
    <span class="cp-legend-item"><span class="cp-legend-dot" style="background:#e5395533;border:1px solid #e5395580"></span> Missed entry</span>
    <span class="cp-legend-item"><span class="cp-legend-dot" style="background:#F1F5FB"></span> Not due yet</span>
    <span style="margin-left:auto;color:var(--text-muted)" id="cp-range-lbl"></span>
  </div>

  <div class="cp-table-wrap">
    <table class="cp-table" id="cp-table">
      <thead><tr><th class="cp-row-label">Form</th></tr></thead>
      <tbody><tr><td class="cp-empty" colspan="1">Loading…</td></tr></tbody>
    </table>
  </div>
</main>

<footer class="dash-footer">
  <span>Lake Cement Ltd. &copy; 2026 &nbsp;|&nbsp; Nyati Cement &nbsp;&bull;&nbsp; Hushika Haraka &nbsp;&bull;&nbsp; Hudumu Zaidi</span>
  <span id="footer-date"></span>
</footer>
<div class="brand-accent-bar"></div>

<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script>
  lucide.createIcons();
  requireAuth();
  applyCompletenessPermissions();
</script>
<script src="forms/api-client.js"></script>
<script src="forms/client-errors.js"></script>
<script>
(function () {
  'use strict';

  function todayIso() { return new Date().toISOString().slice(0, 10); }
  function addMonths(iso, n) {
    var d = new Date(iso + 'T00:00:00');
    d.setMonth(d.getMonth() + n);
    return d.toISOString().slice(0, 10);
  }
  function fmtShort(iso) {
    var d = new Date(iso + 'T00:00:00');
    return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
  }

  var fromEl = document.getElementById('cp-from');
  var toEl   = document.getElementById('cp-to');
  var lblEl  = document.getElementById('cp-range-lbl');

  function setPillsRange(months) {
    var to = todayIso();
    var from = addMonths(to, -months);
    fromEl.value = from;
    toEl.value = to;
  }

  async function load() {
    var from = fromEl.value, to = toEl.value;
    if (!from || !to || from > to) return;
    lblEl.textContent = fmtShort(from) + ' → ' + fmtShort(to);

    var table = document.getElementById('cp-table');
    var thead = table.querySelector('thead tr');
    var tbody = table.querySelector('tbody');

    var payload;
    try {
      payload = await NyatiAPI.getCompleteness(from, to);
    } catch (e) {
      tbody.innerHTML = '<tr><td class="cp-empty">Could not load completeness data — is the server reachable?</td></tr>';
      return;
    }

    var days = payload.days || [];
    var forms = payload.forms || [];

    /* Header row: form-label column + one column per day, week boundary marked */
    var headHtml = '<th class="cp-row-label">Form</th>';
    days.forEach(function (day, i) {
      var d = new Date(day.date + 'T00:00:00');
      var isMonday = d.getDay() === 1;
      headHtml += '<th class="cp-col-hdr' + (isMonday && i > 0 ? ' wk-start' : '') + '" title="' + day.date + '">' + fmtShort(day.date) + '</th>';
    });
    headHtml += '<th class="cp-row-label" style="text-align:right">On time</th>';
    thead.innerHTML = headHtml;

    /* One row per form type */
    var todayStr = todayIso();
    var rows = forms.map(function (f) {
      var presentCount = 0, dueCount = 0;
      var cellsHtml = days.map(function (day, i) {
        var entry = day.forms.find(function (x) { return x.formType === f.formType; });
        var isFuture = day.date > todayStr;
        var d = new Date(day.date + 'T00:00:00');
        var wkStart = d.getDay() === 1 && i > 0;
        var cls = isFuture ? 'future' : (entry && entry.present ? 'present' : 'missing');
        if (!isFuture) { dueCount++; if (entry && entry.present) presentCount++; }
        return '<td class="cp-cell' + (wkStart ? ' wk-start' : '') + '" title="' + f.label + ' — ' + day.date + ': ' + (isFuture ? 'not due yet' : (entry && entry.present ? 'entered' : 'MISSED')) + '">' +
          '<span class="cp-dot ' + cls + '"></span></td>';
      }).join('');
      var pct = dueCount ? Math.round(presentCount / dueCount * 100) : 0;
      var pctCls = pct >= 90 ? 'good' : (pct >= 70 ? 'fair' : 'poor');
      return '<tr><td class="cp-row-label">' + f.label + '</td>' + cellsHtml +
        '<td class="cp-pct ' + pctCls + '">' + pct + '%</td></tr>';
    }).join('');

    tbody.innerHTML = rows || '<tr><td class="cp-empty">No forms configured</td></tr>';
  }

  document.querySelectorAll('.cp-pill[data-months]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      document.querySelectorAll('.cp-pill[data-months]').forEach(function (b) { b.classList.remove('active'); });
      btn.classList.add('active');
      setPillsRange(parseInt(btn.dataset.months, 10));
      load();
    });
  });
  document.getElementById('cp-apply').addEventListener('click', function () {
    document.querySelectorAll('.cp-pill[data-months]').forEach(function (b) { b.classList.remove('active'); });
    load();
  });

  setPillsRange(3);
  load();

  var _dateStr = new Date().toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'long', year: 'numeric' });
  var fEl = document.getElementById('footer-date');
  if (fEl) fEl.textContent = _dateStr;
}());
</script>
</body>
</html>
