    /* ══════════════════════════════════════════════════════
       STOPPAGE TIME DASHBOARD — page-specific styles
    ══════════════════════════════════════════════════════ */
    body { display:flex; flex-direction:column; min-height:100vh; background:var(--off-white); }

    /* ── Filter bar ── */
    .sd-filter {
      background:white; border-bottom:1px solid var(--border);
      padding:10px 24px; display:flex; align-items:center; gap:14px; flex-wrap:wrap;
      box-shadow:var(--shadow-sm); position:sticky; top:0; z-index:50;
    }
    .sd-filter-lbl { font-size:9px; font-weight:700; text-transform:uppercase; letter-spacing:.7px; color:var(--text-muted); }
    .sd-select {
      font-family:var(--font); font-size:12px; font-weight:600; color:var(--text-main);
      background:var(--off-white); border:1.5px solid var(--border); border-radius:var(--radius);
      padding:5px 10px; outline:none; cursor:pointer; appearance:none;
    }
    .sd-select:focus { border-color:var(--orange); background:white; }
    .sd-badge {
      margin-left:auto; display:flex; align-items:center; gap:6px;
      font-size:11px; font-weight:700; color:var(--text-muted);
    }
    .sd-data-chip {
      padding:4px 10px; border-radius:12px; font-size:10px; font-weight:700;
      background:#ECFDF5; color:#059669; border:1px solid #A7F3D0;
    }
    .sd-data-chip.live { background:#FFF7ED; color:#D97706; border-color:#FDE68A; }

    /* ── Main container ── */
    .sd-main { flex:1; padding:20px 24px 48px; max-width:1700px; margin:0 auto; width:100%; }

    /* ── Overview summary strip ── */
    .sd-overview {
      display:grid; grid-template-columns:repeat(7,1fr); gap:10px; margin-bottom:24px;
    }
    @media(max-width:1200px) { .sd-overview { grid-template-columns:repeat(4,1fr); } }
    @media(max-width:700px)  { .sd-overview { grid-template-columns:repeat(2,1fr); } }

    .ov-chip {
      background:white; border:1px solid var(--border); border-radius:10px;
      padding:12px 14px; cursor:pointer; transition:box-shadow .15s, transform .1s;
      text-decoration:none;
    }
    .ov-chip:hover { box-shadow:var(--shadow-md); transform:translateY(-1px); }
    .ov-chip-name { font-size:9px; font-weight:700; text-transform:uppercase; letter-spacing:.5px; color:var(--text-muted); }
    .ov-chip-hrs  { font-size:22px; font-weight:800; color:var(--navy); line-height:1.1; margin:4px 0 6px; }
    .ov-chip-bar-bg { height:5px; background:#E2E8F0; border-radius:3px; overflow:hidden; }
    .ov-chip-bar-fill { height:100%; border-radius:3px; background:var(--orange); transition:width .4s; }
    .ov-chip-avail { font-size:10px; font-weight:600; color:var(--text-muted); margin-top:4px; }
    .ov-chip-avail span { font-weight:800; }
    .ov-chip-avail .green { color:var(--green); }
    .ov-chip-avail .red   { color:var(--red); }

    /* ── Section grid ── */
    .sd-grid {
      display:grid; grid-template-columns:repeat(2,1fr); gap:18px;
    }
    @media(max-width:900px) { .sd-grid { grid-template-columns:1fr; } }
    .sd-grid .full-row { grid-column:1/-1; }

    /* ── Section card ── */
    .sc-card {
      background:white; border:1px solid var(--border); border-radius:12px;
      overflow:hidden; box-shadow:var(--shadow-sm);
    }
    .sc-card-header {
      display:flex; justify-content:space-between; align-items:center;
      padding:14px 18px 12px; border-bottom:1px solid var(--border);
      background:linear-gradient(135deg,#F8FAFC 0%,white 100%);
    }
    .sc-card-title {
      display:flex; align-items:center; gap:8px;
      font-size:14px; font-weight:800; color:var(--navy); letter-spacing:-.1px;
    }
    .sc-card-icon { color:var(--orange); }
    .sc-total-badge {
      font-size:11px; font-weight:700; padding:4px 12px; border-radius:20px;
      background:#FFF7ED; color:var(--orange); border:1px solid #FDE68A;
    }
    .sc-card-body {
      display:flex; gap:0; align-items:stretch; min-height:260px;
    }
    .sc-chart-wrap {
      flex:0 0 200px; display:flex; flex-direction:column; align-items:center;
      justify-content:center; padding:16px 8px 16px 16px; border-right:1px solid var(--border);
    }
    .sc-chart-canvas { width:160px !important; height:160px !important; }
    .sc-legend { margin-top:10px; width:100%; }
    .sc-leg-row {
      display:flex; align-items:center; justify-content:space-between;
      font-size:10px; padding:2px 4px; border-radius:3px;
    }
    .sc-leg-row:hover { background:#F8FAFC; }
    .sc-leg-left { display:flex; align-items:center; gap:5px; }
    .sc-leg-dot  { width:8px; height:8px; border-radius:2px; flex-shrink:0; }
    .sc-leg-name { font-weight:600; color:var(--text-dark); }
    .sc-leg-val  { font-weight:700; color:var(--text-muted); }

    /* ── Reasons table ── */
    .sc-table-wrap { flex:1; overflow-y:auto; max-height:320px; }
    .sc-table {
      width:100%; border-collapse:collapse; font-size:11px;
    }
    .sc-table thead th {
      position:sticky; top:0; background:#F8FAFC; padding:8px 12px;
      font-size:9px; font-weight:700; text-transform:uppercase; letter-spacing:.6px;
      color:var(--text-muted); border-bottom:1px solid var(--border); text-align:left;
    }
    .sc-table thead th:last-child { text-align:right; }
    .sc-table tbody tr { border-bottom:1px solid #F1F5F9; }
    .sc-table tbody tr:hover { background:#FAFBFC; }
    .sc-table td { padding:7px 12px; color:var(--text-dark); vertical-align:middle; }
    .sc-table td:last-child { text-align:right; font-weight:700; color:var(--text-dark); white-space:nowrap; }
    .sc-dept-dot {
      display:inline-block; width:7px; height:7px; border-radius:2px;
      margin-right:6px; vertical-align:middle; flex-shrink:0;
    }
    .sc-table tfoot td {
      padding:8px 12px; font-size:11px; font-weight:800; color:var(--navy);
      border-top:2px solid var(--border); background:#F8FAFC;
    }
    .sc-table tfoot td:last-child { text-align:right; }

    /* no-data state */
    .sc-no-data {
      display:flex; align-items:center; justify-content:center;
      height:120px; color:var(--text-muted); font-size:12px;
    }

    /* ── Dept colour tokens ── */
    :root {
      --c-mech:    #EF4444;
      --c-ei:      #3B82F6;
      --c-prod:    #10B981;
      --c-planned: #8B5CF6;
      --c-power:   #F59E0B;
      --c-others:  #94A3B8;
    }

    @media print {
      .dept-nav, .sd-filter, .top-header::after { display:none !important; }
      .top-header { position:static !important; }
      .sd-card-body { max-height:none !important; }
    }
  </style>
</head>

/* ── Utility ─────────────────────────────────────────────── */
function fmtHrs(h) {
  if (h === 0) return '0.00';
  return h.toFixed(2);
}
function availability(totalHrs, daysInMonth) {
  const cap = daysInMonth * 24;
  return Math.max(0, ((cap - totalHrs) / cap * 100)).toFixed(1);
}

/* ── Read localStorage for a month ──────────────────────── */
function readLiveData(yr, mo) {
  // Aggregate stop_*_* fields (in minutes → convert to hours) across all days
  const agg = {};
  const moStr = String(mo).padStart(2,'0');
  let hasData = false;

  for (let d = 1; d <= 31; d++) {
    const key = `nyati-stoppage-${yr}-${moStr}-${String(d).padStart(2,'0')}`;
    const raw = localStorage.getItem(key);
    if (!raw) continue;
    try {
      const data = JSON.parse(raw).data ?? {};
      // Fields: stop_{section}_{cat}  e.g. stop_crusher_mech (minutes)
      Object.entries(data).forEach(([k, v]) => {
        if (!k.startsWith('stop_')) return;
        const parts = k.split('_'); // ['stop', section, cat]
        if (parts.length < 3) return;
        const section = parts.slice(1, -1).join('_');
        const cat     = parts[parts.length - 1];
        agg[section] = agg[section] ?? {};
        agg[section][cat] = (agg[section][cat] ?? 0) + (parseFloat(v) || 0);
        hasData = true;
      });
    } catch {}
  }

  if (!hasData) return null;

  // Convert minutes to hours, map section keys to dataset keys
  const KEY_MAP = { rm:'rawmill', cm_coal:'coalmill', cm1:'cm1', cm2:'cm2', packing:'packing', crusher:'crusher', kiln:'kiln' };
  const result = {};
  Object.entries(agg).forEach(([sec, cats]) => {
    const dsKey = KEY_MAP[sec] ?? sec;
    result[dsKey] = {};
    Object.entries(cats).forEach(([cat, mins]) => {
      result[dsKey][cat] = Math.round((mins / 60) * 100) / 100;
    });
  });
  return result;
}

/* ── Charts map ──────────────────────────────────────────── */
const charts = {};

/* ── Build overview chip ─────────────────────────────────── */
function buildOverview(data, maxHrs) {
  const el = document.getElementById('sd-overview');
  el.innerHTML = '';
  let grandTotal = 0;

  Object.entries(data.sections).forEach(([key, sec]) => {
    const total = sec.total ?? Object.values(sec.categories).reduce((a,b)=>a+b,0);
    grandTotal += total;
    const pct   = Math.min(100, (total / maxHrs) * 100);
    const avail = availability(total, 30);
    const availClass = parseFloat(avail) >= 90 ? 'green' : 'red';

    const chip = document.createElement('a');
    chip.className = 'ov-chip';
    chip.href = `#section-${key}`;
    chip.innerHTML = `
      <div class="ov-chip-name">${sec.label}</div>
      <div class="ov-chip-hrs">${fmtHrs(total)}<span style="font-size:11px;font-weight:600;color:var(--text-muted);margin-left:3px;">hrs</span></div>
      <div class="ov-chip-bar-bg"><div class="ov-chip-bar-fill" style="width:${pct}%"></div></div>
      <div class="ov-chip-avail">Avail: <span class="${availClass}">${avail}%</span></div>
    `;
    el.appendChild(chip);
  });

  document.getElementById('sd-grand-total').textContent = fmtHrs(grandTotal) + ' hrs';
}

/* ── Build section card ──────────────────────────────────── */
function buildCard(key, sec, liveOverride) {
  const cats    = liveOverride ?? sec.categories;
  const total   = Object.values(cats).reduce((a,b)=>a+b,0);
  const reasons = sec.reasons;

  // Legend rows
  const legendHTML = DEPT_KEYS.map(dk => {
    const v = cats[dk] ?? 0;
    if (v === 0) return '';
    const pct = total > 0 ? (v/total*100).toFixed(0) : 0;
    return `<div class="sc-leg-row">
      <div class="sc-leg-left">
        <div class="sc-leg-dot" style="background:${DEPT_CONFIG[dk].color}"></div>
        <span class="sc-leg-name">${DEPT_CONFIG[dk].label}</span>
      </div>
      <span class="sc-leg-val">${fmtHrs(v)}h &nbsp;${pct}%</span>
    </div>`;
  }).join('');

  // Reasons rows
  const reasonRows = reasons.map(r => {
    const col = DEPT_CONFIG[r.dept]?.color ?? '#94A3B8';
    return `<tr>
      <td><span class="sc-dept-dot" style="background:${col}"></span>${r.reason}</td>
      <td>${fmtHrs(r.hrs)}</td>
    </tr>`;
  }).join('');

  const isFullRow = key === 'packing';
  const card = document.createElement('div');
  card.className = 'sc-card' + (isFullRow ? ' full-row' : '');
  card.id = `section-${key}`;
  card.innerHTML = `
    <div class="sc-card-header">
      <div class="sc-card-title">
        <i data-lucide="${sec.icon ?? 'alert-triangle'}" class="sc-card-icon" style="width:16px;height:16px"></i>
        ${sec.label}
      </div>
      <span class="sc-total-badge">${fmtHrs(total)} hrs total</span>
    </div>
    <div class="sc-card-body">
      <div class="sc-chart-wrap">
        <canvas class="sc-chart-canvas" id="chart-${key}"></canvas>
        <div class="sc-legend">${legendHTML}</div>
      </div>
      <div class="sc-table-wrap">
        <table class="sc-table">
          <thead>
            <tr><th>Reason / Description</th><th>Hrs</th></tr>
          </thead>
          <tbody>${reasonRows || '<tr><td colspan="2" class="sc-no-data">No stoppage data</td></tr>'}</tbody>
          <tfoot>
            <tr><td>TOTAL STOPPAGE</td><td>${fmtHrs(total)}</td></tr>
          </tfoot>
        </table>
      </div>
    </div>`;

  return card;
}

/* ── Render chart for a section ──────────────────────────── */
function renderChart(key, cats) {
  const ctx = document.getElementById(`chart-${key}`);
  if (!ctx) return;

  // Destroy existing chart if any
  if (charts[key]) { charts[key].destroy(); }

  const labels = [];
  const values = [];
  const colors = [];

  DEPT_KEYS.forEach(dk => {
    const v = cats[dk] ?? 0;
    if (v > 0) {
      labels.push(DEPT_CONFIG[dk].label);
      values.push(v);
      colors.push(DEPT_CONFIG[dk].color);
    }
  });

  if (values.length === 0) return;

  charts[key] = new Chart(ctx, {
    type: 'doughnut',
    data: {
      labels,
      datasets: [{
        data: values,
        backgroundColor: colors,
        borderColor: 'white',
        borderWidth: 2,
        hoverOffset: 4,
      }]
    },
    options: {
      responsive: false,
      cutout: '62%',
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: ctx => ` ${ctx.label}: ${fmtHrs(ctx.raw)} hrs (${(ctx.raw / ctx.dataset.data.reduce((a,b)=>a+b,0)*100).toFixed(1)}%)`
          }
        }
      }
    }
  });
}

/* ── Main render ─────────────────────────────────────────── */
function renderDashboard() {
  const mo  = +document.getElementById('sd-month').value;
  const yr  =  document.getElementById('sd-year').value;
  const moPad = String(mo).padStart(2,'0');

  const liveData = readLiveData(yr, mo);
  const isLive   = liveData !== null;

  // Update badge
  const badge = document.getElementById('sd-data-badge');
  const MONTHS = ['','Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  if (isLive) {
    badge.textContent = `Live · ${MONTHS[mo]} ${yr}`;
    badge.className = 'sd-data-chip live';
  } else {
    badge.textContent = `Base data · ${MONTHS[mo]} ${yr}`;
    badge.className = 'sd-data-chip';
  }

  // Build display dataset — overlay live data on base categories
  const displayData = { ...STOPPAGE_BASE_DATA, sections: {} };
  Object.entries(STOPPAGE_BASE_DATA.sections).forEach(([key, sec]) => {
    const liveCats = isLive ? liveData[key] : null;
    displayData.sections[key] = {
      ...sec,
      categories: liveCats ?? sec.categories,
      total: liveCats
        ? Object.values(liveCats).reduce((a,b)=>a+b,0)
        : sec.total,
    };
  });

  // Max hours for bar scaling (use highest total across sections)
  const maxHrs = Math.max(...Object.values(displayData.sections).map(s => s.total));

  // Overview strip
  buildOverview(displayData, maxHrs);

  // Section cards
  const grid = document.getElementById('sd-grid');
  grid.innerHTML = '';
  Object.entries(displayData.sections).forEach(([key, sec]) => {
    const liveCats = isLive ? liveData[key] : null;
    const card = buildCard(key, sec, liveCats);
    grid.appendChild(card);
  });

  // Init Lucide icons then render charts
  if (window.lucide) lucide.createIcons();
  Object.entries(displayData.sections).forEach(([key, sec]) => {
    const liveCats = isLive ? liveData[key] : null;
    renderChart(key, liveCats ?? sec.categories);
  });
}

/* ── Date helpers ─────────────────────────────────────────── */
function setDates() {
  const now  = new Date();
  const opts = { weekday:'short', year:'numeric', month:'short', day:'numeric' };
  const str  = now.toLocaleDateString('en-GB', opts);
  const el1  = document.getElementById('live-date');
  const el2  = document.getElementById('footer-date');
  if (el1) el1.textContent = str;
  if (el2) el2.textContent = str;
}

/* ── INIT ─────────────────────────────────────────────────── */
document.addEventListener('DOMContentLoaded', () => {
  setDates();
  renderDashboard();

  document.getElementById('sd-month').addEventListener('change', renderDashboard);
  document.getElementById('sd-year').addEventListener('change', renderDashboard);

  if (window.lucide) lucide.createIcons();
});
</script>
